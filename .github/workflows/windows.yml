name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          $output = & cmake --build build --config Release --parallel 2>&1 |
            Tee-Object -Variable captured
          $status = $LASTEXITCODE
          foreach ($line in $captured) {
            $text = "$line"
            if (
              $text -match '^(.*)\((\d+)(?:,\d+)?\): (error [A-Z]+\d+: .*)$'
            ) {
              $path = $matches[1] -replace '\\', '/'
              Write-Output "::error file=$path,line=$($matches[2])::$($matches[3])"
            } elseif ($text -match '^LINK : (fatal error .*)$') {
              Write-Output "::error title=Linker::$($matches[1])"
            }
          }
          if ($status -ne 0) {
            exit $status
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out
          Copy-Item build/Release/Orkela.exe out/Orkela.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Orkela-windows-x64
          path: out/Orkela.exe
          if-no-files-found: error
