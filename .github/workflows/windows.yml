name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out
          Copy-Item build/Release/Orkela.exe out/Orkela.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Orkela-windows-x64
          path: out/Orkela.exe
          if-no-files-found: error
