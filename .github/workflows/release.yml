name: Publish Validated Alpha

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0-alpha.6
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Assemble exact validated artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the requested immutable tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Verify tag, version, and source identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          expected="v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$RELEASE_TAG" = "$expected"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          source_sha="$(git rev-parse HEAD)"
          test -n "$source_sha"
          test "$tag_sha" = "$source_sha"
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Locate successful required workflows for this commit
        id: runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail

          successful_run() {
            local workflow="$1"
            local result
            result="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$SOURCE_SHA" \
                --limit 20 \
                --json databaseId,status,conclusion,createdAt \
                --jq '
                  [
                    .[]
                    | select(
                        .status == "completed"
                        and .conclusion == "success"
                      )
                  ]
                  | sort_by(.createdAt)
                  | last
                  | .databaseId // empty
                '
            )"
            test -n "$result"
            printf '%s' "$result"
          }

          windows="$(successful_run windows.yml)"
          desktop="$(successful_run desktop-unix.yml)"
          mobile="$(successful_run mobile.yml)"
          update_security="$(successful_run update-security.yml)"
          {
            echo "windows=$windows"
            echo "desktop=$desktop"
            echo "mobile=$mobile"
            echo "update_security=$update_security"
          } >> "$GITHUB_OUTPUT"

      - name: Download only product artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p gathered/windows gathered/desktop gathered/mobile

          gh run download "${{ steps.runs.outputs.windows }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Orkela-Windows-*' \
            --dir gathered/windows

          for pattern in \
            'Orkela-Ubuntu-*' \
            'Orkela-Debian-*' \
            'Orkela-FreeBSD-*' \
            'Orkela-macOS-*'
          do
            gh run download "${{ steps.runs.outputs.desktop }}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$pattern" \
              --dir gathered/desktop
          done

          gh run download "${{ steps.runs.outputs.mobile }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Orkela-product-Android-*' \
            --dir gathered/mobile

      - name: Flatten artifacts and reject collisions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("gathered")
          target = Path("release-assets")
          target.mkdir()
          for path in sorted(source.rglob("*")):
              if not path.is_file():
                  continue
              destination = target / path.name
              if destination.exists():
                  raise SystemExit(
                      f"duplicate release filename: {destination.name}"
                  )
              shutil.copy2(path, destination)
          PY

          version="$RELEASE_VERSION"
          required=(
            "Orkela-Windows-x64-$version-Setup.exe"
            "Orkela-Windows-arm64-$version-Setup.exe"
            "Orkela-Ubuntu-24.04-amd64-$version.deb"
            "Orkela-Debian-13-amd64-$version.deb"
            "Orkela-FreeBSD-14-amd64-$version.pkg"
            "Orkela-macOS-arm64-$version.pkg"
            "Orkela-macOS-x86_64-$version.pkg"
          )
          for artifact in "${required[@]}"; do
            test -s "release-assets/$artifact"
          done
          find release-assets -maxdepth 1 -type f -name \
            'Orkela-Android-*.tar.gz' -print -quit | grep -q .

      - name: Generate hashes and explicitly unsigned update metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          base_url="$(
            printf \
              'https://github.com/%s/releases/download/%s' \
              "$GITHUB_REPOSITORY" \
              "$RELEASE_TAG"
          )"
          python3 tools/release/generate_update_manifest.py \
            --version-file VERSION \
            --channel beta \
            --commit "$SOURCE_SHA" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "$base_url" \
            --artifact \
              "release-assets/Orkela-Windows-x64-$version-Setup.exe:windows:x64:installer" \
            --artifact \
              "release-assets/Orkela-Windows-arm64-$version-Setup.exe:windows:arm64:installer" \
            --artifact \
              "release-assets/Orkela-Ubuntu-24.04-amd64-$version.deb:ubuntu:x64:deb" \
            --artifact \
              "release-assets/Orkela-Debian-13-amd64-$version.deb:debian:x64:deb" \
            --artifact \
              "release-assets/Orkela-FreeBSD-14-amd64-$version.pkg:freebsd:x64:pkg" \
            --artifact \
              "release-assets/Orkela-macOS-arm64-$version.pkg:macos:arm64:pkg" \
            --artifact \
              "release-assets/Orkela-macOS-x86_64-$version.pkg:macos:x86_64:pkg" \
            --output release-assets/orkela-update-v1.unsigned.json

          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name SHA256SUMS \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Publish immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "Release $RELEASE_TAG already exists; refusing overwrite"
            exit 1
          fi

          cat > release-notes.md <<EOF
          Orkela $RELEASE_VERSION validated alpha.

          Source commit: \`$SOURCE_SHA\`

          The Windows, Ubuntu, Debian, FreeBSD, macOS, and Android artifacts
          were collected only from successful required workflows for this
          exact commit. See \`CHANGELOG.md\` and the release-evidence reports.

          This alpha is not an authenticated automatic-update channel.
          \`orkela-update-v1.unsigned.json\` is transparent release metadata,
          not an executable trust root. Stable updates remain disabled until
          protected Ed25519, Authenticode, Developer ID, and store signing are
          configured.
          EOF

          mapfile -d '' assets < <(
            find release-assets -maxdepth 1 -type f -print0 | sort -z
          )
          remote_tag_sha="$(
            git ls-remote origin "refs/tags/$RELEASE_TAG" |
              awk 'NR == 1 { print $1 }'
          )"
          remote_peeled_sha="$(
            git ls-remote origin "refs/tags/$RELEASE_TAG^{}" |
              awk 'NR == 1 { print $1 }'
          )"
          remote_source_sha="${remote_peeled_sha:-$remote_tag_sha}"
          test -n "$remote_source_sha"
          test "$remote_source_sha" = "$SOURCE_SHA"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Orkela $RELEASE_VERSION" \
            --notes-file release-notes.md \
            --prerelease \
            "${assets[@]}"
